services:
  postgres:
    image: postgres:16-alpine
    container_name: systrol_postgres
    restart: always
    environment:
      POSTGRES_USER: systrol
      POSTGRES_PASSWORD: systrol_secret_password
      POSTGRES_DB: systrol_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: systrol_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: systrol_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: systrol_api
    restart: always
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://systrol:systrol_secret_password@postgres:5432/systrol_erp?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "systrol-production-jwt-super-secret-key-32chars"
      PORT: "4000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
