name: Changeset Reminder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-changeset:
    name: Check Changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Changeset Presence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const changesetDir = path.join(process.cwd(), '.changeset');
            let hasChangeset = false;
            
            if (fs.existsSync(changesetDir)) {
              const files = fs.readdirSync(changesetDir);
              hasChangeset = files.some(f => f.endsWith('.md') && f.toLowerCase() !== 'readme.md');
            }
            
            const { owner, repo, number: issue_number } = context.issue;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            
            const botComment = comments.data.find(c => c.body.includes('<!-- changeset-reminder-bot -->'));
            
            if (!hasChangeset) {
              const body = `<!-- changeset-reminder-bot -->
            ### ⚠️ No Changeset Detected
            
            This PR does not include a changeset file.
            - If this PR includes user-facing changes or versioned updates, run \`pnpm changeset\` in your terminal, commit the generated file, and push.
            - If this is a documentation fix, internal chore, or CI update, no changeset is needed and this PR can be merged safely without bumping package versions.`;
            
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } else if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: `<!-- changeset-reminder-bot -->
            ### ✅ Changeset Detected
            
            A changeset file was found in this PR. Package versions will bump automatically upon merge to \`main\`.`,
              });
            }
