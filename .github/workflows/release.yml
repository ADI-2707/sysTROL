name: Version & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version-bump:
    name: Version Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Changesets and Bump Versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGESETS=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md")
          if [ -n "$CHANGESETS" ]; then
            pnpm version-packages
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "chore(release): version packages [skip ci]"
              git push origin main
            fi
          else
            echo "No changesets found. Skipping version bump."
          fi
